<!DOCTYPE html>
<html>
<head>
    <title>Image to Twitch Ascii Art Converter</title>
    <style>
        body {
            background: #18181b;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        #output {
            white-space: pre;
            background: #0e0e10;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            font-family: monospace;
            width: 90%;
            overflow-x: auto;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }
        button {
            background: #9147ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #772ce8;
        }
        canvas {
            display: none;
        }
        #preview {
            max-width: 500px;
            margin: 20px 0;
        }
        .settings {
            display: flex;
            gap: 20px;
            margin: 10px 0;
        }
        .settings label {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
    </style>
</head>
<body>
    <h1>Image to Twitch Ascii Art Converter</h1>
    <input type="file" accept="image/*" id="imageInput">
    <img id="preview">
    <div class="settings">
        <label>
            Width (chars)
            <input type="number" id="width" value="30" min="10" max="100">
        </label>
        <label>
            Brightness
            <input type="range" id="brightness" min="0" max="200" value="100">
        </label>
        <label>
            Contrast
            <input type="range" id="contrast" min="0" max="200" value="100">
        </label>
    </div>
    <div class="controls">
        <button onclick="convert()">Convert</button>
        <button onclick="copyToClipboard()">Copy to Clipboard</button>
    </div>
    <div id="output"></div>
    <canvas id="canvas"></canvas>

    <script>
        const characters = `⠀⠁⠂⠃⠄⠅⠆⠇⠈⠉⠊⠋⠌⠍⠎⠏⠐⠑⠒⠓⠔⠕⠖⠗⠘⠙⠚⠛⠜⠝⠞⠟⠠⠡⠢⠣⠤⠥⠦⠧⠨⠩⠪⠫⠬⠭⠮⠯⠰⠱⠲⠳⠴⠵⠶⠷⠸⠹⠺⠻⠼⠽⠾⠿`;
        let img = new Image();
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const preview = document.getElementById('preview');
        const output = document.getElementById('output');

        document.getElementById('imageInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    img.src = e.target.result;
                    preview.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        function getPixelBrightness(imageData, x, y) {
            const i = (y * imageData.width + x) * 4;
            const r = imageData.data[i];
            const g = imageData.data[i + 1];
            const b = imageData.data[i + 2];
            return (r + g + b) / 3;
        }

        function convert() {
            const width = parseInt(document.getElementById('width').value);
            const brightness = parseInt(document.getElementById('brightness').value) / 100;
            const contrast = parseInt(document.getElementById('contrast').value) / 100;

            const height = Math.floor((width * img.height) / img.width);
            
            canvas.width = width;
            canvas.height = height;
            
            ctx.filter = `brightness(${brightness}) contrast(${contrast})`;
            ctx.drawImage(img, 0, 0, width, height);
            
            const imageData = ctx.getImageData(0, 0, width, height);
            let result = '';
            
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const brightness = getPixelBrightness(imageData, x, y);
                    const charIndex = Math.floor((brightness / 255) * (characters.length - 1));
                    result += characters[charIndex];
                }
                result += '\n';
            }

            // Split into chunks of 500 characters for Twitch chat
            const chunks = result.match(/.{1,500}/g);
            output.textContent = chunks.join('\n\n--- Next Message ---\n\n');
        }

        function copyToClipboard() {
            navigator.clipboard.writeText(output.textContent).then(() => {
                alert('Copied to clipboard!');
            });
        }
    </script>

</body>
</html>
